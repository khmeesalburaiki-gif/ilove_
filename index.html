<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d24">
    <title>إلى أبعد نجمة 🌙</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sky">
        <div class="moon"></div>
        <div class="stars"></div>
        <div class="shooting-star"></div>
    </div>

    <main class="card">

        <div class="eyebrow">
            رسالة صغيرة تحت ضوء القمر
        </div>

        <h1>إلى أبعد نجمة 🌙</h1>

        <p class="intro">
            في كلام ساكن بقلبي…
            ويمكن الليلة صار وقته يطلع.
        </p>

        <div class="heart">♡</div>

        <section class="reveal-area" aria-live="polite">
            <p id="message" class="message">
                إذا وصلت لهنا، خذ نفسًا هادئًا…
                عندي لك مفاجأة صغيرة.
            </p>

            <p id="counter" class="counter">
                البداية فقط ✨
            </p>
        </section>

        <button id="revealBtn" class="main-button">
            افتح أول باب 💌
        </button>

        <button id="restartBtn" class="restart-button" hidden>
            نقرأها من جديد ↺
        </button>

        <div class="footer">
            بعض الأشخاص… يجعلون حتى الليل أدفأ.
        </div>

    </main>

    <div id="finalGlow" class="final-glow"></div>

    <script src="script.js"></script>
</body>
</html>
